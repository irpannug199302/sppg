<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Video 3D Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090b14;
            --primary: #4f46e5;
            --primary-glow: #6366f1;
            --primary-shadow: #312e81;
            --success: #10b981;
            --success-glow: #34d399;
            --success-shadow: #064e3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* --- ANIMASI CAHAYA (DIAM DI TEMPAT, HANYA BERPENDAR) --- */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: breathe 5s ease-in-out infinite alternate;
        }

        .glow-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-110%, -60%);
        }

        .glow-2 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.35), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(10%, -40%);
            animation-delay: -2.5s;
        }

        @keyframes breathe {
            0% { opacity: 0.3; filter: blur(60px); }
            100% { opacity: 0.75; filter: blur(90px); }
        }

        /* --- KARTU 3D (DIAM DI TEMPAT + ANIMASI PULSA BORDER) --- */
        .box {
            position: relative;
            z-index: 10;
            background: rgba(22, 27, 46, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 440px;
            /* Efek kedalaman 3D statis */
            box-shadow: 
                0 15px 0 #080a12,
                0 30px 50px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: borderPulse 6s ease-in-out infinite alternate;
        }

        @keyframes borderPulse {
            0% { border-color: rgba(99, 102, 241, 0.2); }
            50% { border-color: rgba(236, 72, 153, 0.4); }
            100% { border-color: rgba(99, 102, 241, 0.5); }
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 25px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Animasi kilau teks judul */
        .title-gradient {
            background: linear-gradient(90deg, #ffffff, #818cf8, #ffffff);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textShine 4s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            display: block;
            margin-bottom: 8px;
            text-align: left;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 14px;
            color: #fff;
            background: rgba(11, 15, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.6);
        }

        input:focus {
            border-color: var(--primary-glow);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6), 0 0 15px rgba(99, 102, 241, 0.35);
        }

        input[readonly] {
            color: #38bdf8;
            font-weight: 500;
            cursor: default;
        }

        /* --- TOMBOL 3D + ANIMASI KILAUAN KACA (SHIMMER) --- */
        .btn-3d {
            position: relative;
            width: 100%;
            border: none;
            color: white;
            padding: 15px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
        }

        /* Efek Shimmer melintas secara periodik */
        .btn-3d::after {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            animation: shimmerSweep 4s infinite;
        }

        @keyframes shimmerSweep {
            0%, 60% { left: -120%; }
            100% { left: 140%; }
        }

        .btn-generate {
            background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 5px 0 var(--primary-shadow), 0 10px 20px rgba(79, 70, 229, 0.35);
        }

        .btn-generate:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--primary-shadow), 0 5px 10px rgba(79, 70, 229, 0.2);
        }

        .btn-copy {
            background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
            box-shadow: 0 5px 0 var(--success-shadow), 0 10px 20px rgba(16, 185, 129, 0.35);
            margin-top: 10px;
        }

        .btn-copy::after {
            animation-delay: 2s; /* Bergantian dengan tombol pertama */
        }

        .btn-copy:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--success-shadow), 0 5px 10px rgba(16, 185, 129, 0.2);
        }

        /* Notifikasi Toast Animasi Fade */
        #toast {
            opacity: 0;
            visibility: hidden;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.95);
            color: #fff;
            padding: 12px 26px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 100;
        }

        #toast.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

<!-- Cahaya pendar (statis, hanya bernapas/pulsing) -->
<div class="glow-orb glow-1"></div>
<div class="glow-orb glow-2"></div>

<div class="box">
    <h2>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span class="title-gradient">Generator Video ID</span>
    </h2>
    
    <label>Input ID atau Link Video:</label>
    <div class="input-group">
        <input type="text" id="rawInput" placeholder="Contoh: CXdziPvQ1 atau link videy/slicedrive">
    </div>
    
    <button class="btn-3d btn-generate" onclick="buatLink()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        Generate ID Pendek
    </button>
    
    <label style="margin-top: 25px;">Hasil URL Pendek:</label>
    <div class="input-group">
        <input type="text" id="resultUrl" readonly placeholder="Hasil akan muncul di sini...">
    </div>
    
    <button class="btn-3d btn-copy" onclick="salinLink()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Salin Link
    </button>
</div>

<div id="toast">Link berhasil disalin!</div>

<script>
    const SALT_KEY = "94821";
    const CHARS = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    function getShift() {
        let sum = 0;
        for (let i = 0; i < SALT_KEY.length; i++) {
            sum += SALT_KEY.charCodeAt(i);
        }
        return sum % CHARS.length;
    }

    function generateSecretId(raw) {
        const shift = getShift();
        let result = '';
        for (let i = 0; i < raw.length; i++) {
            let index = CHARS.indexOf(raw[i]);
            if (index !== -1) {
                let newIndex = (index + shift + (i * 3)) % CHARS.length;
                result += CHARS[newIndex];
            } else {
                result += raw[i];
            }
        }
        return result;
    }

    function buatLink() {
        let input = document.getElementById('rawInput').value.trim();
        if (!input) {
            showToast('⚠️ Masukkan ID atau Link video!');
            return;
        }

        if (input.includes('/')) {
            input = input.split('/').filter(Boolean).pop();
        }
        if (input.includes('?mov=')) {
            input = input.split('?mov=').pop();
        }
        input = input.replace('.mp4', '').trim();

        const idAcak = generateSecretId(input);
        const linkLengkap = window.location.origin + `/player.html?mov=${idAcak}`;
        document.getElementById('resultUrl').value = linkLengkap;
        showToast('✨ Link pendek siap!');
    }

    function salinLink() {
        const input = document.getElementById('resultUrl');
        if (!input.value) {
            showToast('⚠️ Belum ada link untuk disalin!');
            return;
        }
        input.select();
        input.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(input.value);
        showToast('📋 Berhasil disalin ke clipboard!');
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => { toast.classList.remove("show"); }, 2200);
    }
</script>

</body>
</html>
