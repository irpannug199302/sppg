<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPG MEDIA</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.video-container{
    position:relative;
    width:min(100%,450px);
    aspect-ratio:9/16;
    overflow:hidden;
    border-radius:8px;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.play-button{
    position:absolute;
    inset:0;
    margin:auto;
    width:70px;
    height:70px;
    border-radius:50%;
    border:2px solid #fff;
    background:rgba(0,0,0,.7);
    cursor:pointer;
}

.play-button:after{
    content:"";
    position:absolute;
    left:28px;
    top:22px;
    border-top:12px solid transparent;
    border-bottom:12px solid transparent;
    border-left:20px solid #fff;
}
</style>
</head>

<body>

<div class="video-container">
    <video id="preview" muted playsinline preload="metadata"></video>
    <button class="play-button" id="playBtn"></button>
</div>

<script>
// Fungsi mengambil parameter URL
function getVideoData(){
    const p = new URLSearchParams(location.search);

    let id = p.get('mov') || p.get('id') || p.get('v') || 'drftHhu31';
    id = id.replace('.mp4','');

    let sub = p.get('sub') || p.get('subid') || p.get('s') || p.get('sub1') || '';
    let title = p.get('title') || p.get('judul') || p.get('name') || p.get('t') || '';

    let parts = [];
    if (title) parts.push(title);
    if (sub) parts.push(sub);
    parts.push(id);

    return { id, sub, title, fullTitle: parts.join(' - ') };
}

const data = getVideoData();
const url = `https://cdn.slicedrv.com/${data.id}.mp4`;

document.title = data.fullTitle;
document.getElementById('preview').src = url;

// Buka player.html terpisah di tab baru dengan membawa parameter URL
document.getElementById('playBtn').onclick = function(){
    const targetUrl = 'player.html' + location.search;
    window.open(targetUrl, '_blank');
};
</script>

</body>
</html>
