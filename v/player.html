<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading Video...</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    box-sizing:border-box;
}

.player-wrapper{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.ad{
    width:100%;
    text-align:center;
    margin:10px auto;
}

video{
    display:block;
    width:auto;
    max-width:100%;
    height:auto;
    max-height:80vh;
    margin:10px auto;
    background:#000;
}

@media(max-width:600px){
    video{
        width:100%;
        max-width:100%;
        max-height:75vh;
    }
}
</style>
</head>

<body>

<div class="player-wrapper">

    <!-- 320x50 AD -->
    <div class="ad">
        <script>
        atOptions = {
            'key':'e7c0275aed6c4d8d23bb62cbad793c2f',
            'format':'iframe',
            'height':50,
            'width':320,
            'params':{}
        };
        </script>
        <script src="https://gymnasiumabc.com/e7c0275aed6c4d8d23bb62cbad793c2f/invoke.js"></script>
    </div>

    <!-- VIDEO PLAYER -->
    <video id="player" controls autoplay muted playsinline></video>

    <!-- SCRIPT DATA & HISTATS -->
    <script type="text/javascript">
    function getVideoData(){
        const p = new URLSearchParams(location.search);
        let id = p.get('mov') || p.get('id') || p.get('v') || 'drftHhu31';
        id = id.replace('.mp4','');

        let sub = p.get('sub') || p.get('subid') || p.get('s') || p.get('sub1') || '';
        let title = p.get('title') || p.get('judul') || p.get('name') || p.get('t') || '';

        let parts = [];
        if (title) parts.push(title);
        if (sub) parts.push(sub);
        parts.push(id);

        return { id, fullTitle: parts.join(' - ') };
    }

    const data = getVideoData();

    // Set judul halaman untuk statistik Histats
    document.title = data.fullTitle;

    // Load source video
    document.getElementById('player').src = `https://cdn.slicedrv.com/${data.id}.mp4`;

    // Histats Counter
    var _Hasync = _Hasync || [];
    _Hasync.push(['Histats.start', '1,4927758,4,0,0,0,00010000']);
    _Hasync.push(['Histats.fasi', '1']);
    _Hasync.push(['Histats.track_hits', '']);

    (function(){
        var hs = document.createElement('script');
        hs.type = 'text/javascript';
        hs.async = true;
        hs.src = '//s10.histats.com/js15_as.js';
        (document.head || document.body).appendChild(hs);
    })();
    </script>

</div>

</body>
</html>
