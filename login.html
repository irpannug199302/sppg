<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStar - Cinema Staff Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-cinema: #0a0e17;
            --accent-red: #e50914;
            --card-cinema: #131b2e;
            --gold: #f59e0b;
        }
        body {
            background: radial-gradient(circle at center, #1a2238 0%, var(--bg-cinema) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Urbanist', sans-serif;
            color: #fff;
        }
        .login-card {
            background-color: var(--card-cinema);
            border: 1px solid rgba(229, 9, 20, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-red), var(--gold));
        }
        .btn-cinema {
            background: linear-gradient(135deg, var(--accent-red), #b20710);
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-cinema:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4);
            color: #fff;
        }
        .form-control-dark {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 10px;
        }
        .form-control-dark:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(229, 9, 20, 0.25);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <i class="fa-solid fa-film fa-3x text-danger mb-2"></i>
        <h3 class="fw-extrabold text-uppercase m-0">Cine<span class="text-danger">Star</span></h3>
        <p class="text-white-50 small">Internal Cinema Management System</p>
    </div>

    <div id="alertMessage" class="alert alert-danger d-none py-2 small"></div>

    <div class="mb-3">
        <label class="form-label small fw-bold text-white-50">Email Operasional</label>
        <input type="email" id="email" class="form-control form-control-dark form-control-lg" placeholder="petugas@cinestar.com">
    </div>
    <div class="mb-4">
        <label class="form-label small fw-bold text-white-50">Kata Sandi</label>
        <input type="password" id="pass" class="form-control form-control-dark form-control-lg" placeholder="••••••••">
    </div>

    <button id="btnMasuk" class="btn btn-cinema btn-lg w-100 mb-3">MASUK KE SISTEM</button>
    <p class="text-center text-secondary small mb-0">© 2026 CineStar Systems. Hak Cipta Dilindungi.</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDeOduyu626TZ9CR0JGvzBH0qJAoArT8rk",
        authDomain: "sppgbangunsari02-b5cb1.firebaseapp.com",
        projectId: "sppgbangunsari02-b5cb1",
        storageBucket: "sppgbangunsari02-b5cb1.firebasestorage.app",
        messagingSenderId: "497486447370",
        appId: "1:497486447370:web:0b2b6ce4297b48d18b70f3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const btnMasuk = document.getElementById("btnMasuk");
    const alertMessage = document.getElementById("alertMessage");

    const showError = (msg) => {
        alertMessage.textContent = msg;
        alertMessage.classList.remove("d-none");
        btnMasuk.textContent = "COBA LAGI";
        btnMasuk.removeAttribute("disabled");
    };

    btnMasuk.addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        const pass = document.getElementById("pass").value.trim();

        if(!email || !pass) return showError("Email dan Password harus diisi!");

        alertMessage.classList.add("d-none");
        btnMasuk.textContent = "MEMERIKSA AKSES...";
        btnMasuk.setAttribute("disabled", "true");

        try {
            const userCred = await signInWithEmailAndPassword(auth, email, pass);
            const userDoc = await getDoc(doc(db, "cinema_users", userCred.user.uid));

            if(userDoc.exists()) {
                const role = userDoc.data().role;
                if(role === "admin") window.location.href = "admin.html";
                else if(role === "operator") window.location.href = "operator.html";
                else window.location.href = "index.html";
            } else {
                showError("Akun belum dikonfigurasi di database 'cinema_users'!");
            }
        } catch(err) {
            showError("Gagal Masuk: " + err.message);
        }
    });
</script>
</body>
</html>
