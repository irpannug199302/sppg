<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Panel - CineStar Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-proyektor: #0a0e1a;
            --card-proyektor: #131b2f;
            --accent-red: #e50914;
        }
        body {
            background-color: var(--bg-proyektor);
            color: #e2e8f0;
            font-family: 'Urbanist', sans-serif;
            padding-bottom: 50px;
        }
        .card-studio {
            background: var(--card-proyektor);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .preview-img {
            max-height: 180px;
            width: 100%;
            object-fit: cover;
            border-radius: 10px;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3 px-3 border-bottom border-danger">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="fa-solid fa-film text-danger me-2"></i> OPERATOR BOOTH CONTROL</span>
        <button class="btn btn-outline-light btn-sm rounded-pill" id="btnLogout">Keluar</button>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8" id="containerDaftarStudio">
            <!-- Data studio dinamis ter-render di sini -->
            <div class="text-center py-5 text-white-50"><i class="fa-solid fa-spinner fa-spin me-2"></i> Mengambil data studio...</div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDeOduyu626TZ9CR0JGvzBH0qJAoArT8rk",
        authDomain: "sppgbangunsari02-b5cb1.firebaseapp.com",
        projectId: "sppgbangunsari02-b5cb1",
        storageBucket: "sppgbangunsari02-b5cb1.firebasestorage.app",
        messagingSenderId: "497486447370",
        appId: "1:497486447370:web:0b2b6ce4297b48d18b70f3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let tempFoto = {};

    firebase.auth().onAuthStateChanged((user) => {
        if(!user) window.location.href = "login.html";
        else loadStudioOperator();
    });

    function loadStudioOperator() {
        db.collection("studios").onSnapshot((snapshot) => {
            const container = document.getElementById("containerDaftarStudio");
            container.innerHTML = "";

            snapshot.forEach((doc) => {
                const s = doc.data();
                const id = doc.id;
                const isPlaying = s.status_tayang === "Sedang Memutar";

                container.innerHTML += `
                    <div class="card-studio">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="fw-bold m-0 text-white"><i class="fa-solid fa-tv text-danger me-2"></i>${s.nama_studio}</h4>
                            <span class="badge ${isPlaying ? 'bg-success' : 'bg-warning text-dark'} px-3 py-2">${s.status_tayang || 'Standby'}</span>
                        </div>
                        <h6 class="text-warning mb-3">Judul: <strong>${s.judul_film || '-'}</strong></h6>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="small text-white-50">Nama Operator</label>
                                <input type="text" id="op-${id}" class="form-control form-control-dark" value="${s.operator !== '-' ? s.operator || '' : ''}" placeholder="Nama Anda...">
                            </div>
                            <div class="col-md-6">
                                <label class="small text-white-50">Suhu Proyektor (°C)</label>
                                <input type="text" id="suhu-${id}" class="form-control form-control-dark" value="${s.suhu_proyektor !== '-' ? s.suhu_proyektor || '' : ''}" placeholder="Contoh: 38°C">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="small text-white-50">Bukti Foto Layar Pemutaran</label>
                            <input type="file" accept="image/*" class="form-control" onchange="previewLayar(this, '${id}')">
                            <img id="prev-${id}" class="preview-img">
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-danger w-50 py-2 fw-bold" onclick="mulaiPutar('${id}')" ${isPlaying ? 'disabled' : ''}>
                                <i class="fa-solid fa-play me-1"></i> Mulai Putar Film
                            </button>
                            <button class="btn btn-secondary w-50 py-2 fw-bold" onclick="selesaiPutar('${id}')" ${!isPlaying ? 'disabled' : ''}>
                                <i class="fa-solid fa-stop me-1"></i> Selesai / Standby
                            </button>
                        </div>
                    </div>
                `;
            });
        });
    }

    window.previewLayar = function(input, id) {
        const file = input.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempFoto[id] = e.target.result;
                const img = document.getElementById(`prev-${id}`);
                img.src = e.target.result;
                img.style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    };

    window.mulaiPutar = async function(id) {
        const op = document.getElementById(`op-${id}`).value.trim();
        const suhu = document.getElementById(`suhu-${id}`).value.trim();
        if(!op) return alert("Harap isi nama operator!");

        const sekarang = new Date();
        const jam = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        await db.collection("studios").doc(id).update({
            status_tayang: "Sedang Memutar",
            operator: op,
            suhu_proyektor: suhu || "Normal",
            jam_mulai: jam,
            foto_bukti: tempFoto[id] || ""
        });
        alert("Status pemutaran film berhasil diaktifkan!");
    };

    window.selesaiPutar = async function(id) {
        if(confirm("Konfirmasi penayangan film di studio ini telah selesai?")) {
            await db.collection("studios").doc(id).update({
                status_tayang: "Selesai",
                suhu_proyektor: "Standby"
            });
        }
    };

    document.getElementById("btnLogout").addEventListener("click", () => {
        firebase.auth().signOut().then(() => window.location.href = "login.html");
    });
</script>
</body>
</html>
