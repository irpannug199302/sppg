
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minalminul</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Memuat file CSS Eksternal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body oncontextmenu="return false">

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">Minalminul</div>
            <a href="" class="upload-btn">Upload</a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main">
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline controls controlsList="nodownload noplaybackrate"></video>
        </div>
    </div>

    <!-- Footer -->
    <footer>© 2026 Minalminul</footer>

    <!-- POPUP Continue Watching -->
    <div class="popup-overlay" id="continuePopup">
        <div class="popup-box">
            <h3>Continue watching?</h3>
            <p>Press continue to keep watching the video.</p>
            <div class="popup-actions">
                <button class="popup-btn" id="continueBtn">Continue Watching</button>
            </div>
        </div>
    </div>

    <!-- Memuat file JS Eksternal -->
    <script src="js/main.js"></script>

    
</body>
</html>
