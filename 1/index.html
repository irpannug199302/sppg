
<!DOCTYPE html>

    <style><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mencegah semua server video memblokir akses dari HP (Bypass 403 Forbidden) -->
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title></title>
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{margin:0;padding:0;background:#000;width:100%;min-height:100vh;font-family:Arial,sans-serif;}
        body{display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;}
        #fs-wrapper{width:100%;display:flex;flex-direction:column;align-items:center;background:#000;}
        .ad-container{width:100%;max-width:600px;margin:8px 0;text-align:center;background:#222;padding:8px;display:flex;justify-content:center;align-items:center;flex-direction:column;}
        .video-container{width:100%;max-width:600px;flex:1;display:flex;justify-content:center;align-items:center;padding:8px;}
        .video-wrapper{width:100%;background:#000;position:relative;}
        video{width:100%;height:auto;max-height:80vh;background:#000;display:block;outline:none;}
        @media (max-width:480px){.ad-container,.video-container{max-width:100%;}}
        
        #fs-wrapper:fullscreen,
        #fs-wrapper:-webkit-full-screen,
        #fs-wrapper:-moz-full-screen,
        #fs-wrapper:-ms-fullscreen{
            width:100vw;height:100vh;background:#000;
            display:flex;flex-direction:column;
            align-items:center;justify-content:space-between;
            overflow-y:auto;overflow-x:hidden;padding:6px 0;
        }
        #fs-wrapper:fullscreen .ad-container,
        #fs-wrapper:-webkit-full-screen .ad-container{flex:0 0 auto;max-width:100%;margin:4px 0;padding:6px;}
        #fs-wrapper:fullscreen .video-container,
        #fs-wrapper:-webkit-full-screen .video-container{flex:1 1 auto;max-width:100%;padding:4px;}
        #fs-wrapper:fullscreen video,
        #fs-wrapper:-webkit-full-screen video{max-height:calc(100vh - 380px);width:100%;height:auto;}
        @media (orientation:landscape){
            #fs-wrapper:fullscreen,#fs-wrapper:-webkit-full-screen{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;}
            #fs-wrapper:fullscreen .video-container,#fs-wrapper:-webkit-full-screen .video-container{flex:1 1 60%;max-width:65%;}
            #fs-wrapper:fullscreen .ad-container,#fs-wrapper:-webkit-full-screen .ad-container{flex:0 0 30%;max-width:32%;}
            #fs-wrapper:fullscreen video,#fs-wrapper:-webkit-full-screen video{max-height:96vh;}
        }

        body.pseudo-fs{overflow:hidden;}
        body.pseudo-fs #fs-wrapper{
            position:fixed;top:0;left:0;right:0;bottom:0;
            width:100vw;height:100vh;height:100dvh;
            z-index:999999;background:#000;
            display:flex;flex-direction:column;
            align-items:center;justify-content:space-between;
            overflow-y:auto;overflow-x:hidden;padding:6px 0;
        }
        body.pseudo-fs #fs-wrapper .ad-container{flex:0 0 auto;max-width:100%;margin:4px 0;}
        body.pseudo-fs #fs-wrapper .video-container{flex:1 1 auto;max-width:100%;}
        body.pseudo-fs #fs-wrapper video{max-height:calc(100vh - 380px);max-height:calc(100dvh - 380px);}
        @media (orientation:landscape){
            body.pseudo-fs #fs-wrapper{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;}
            body.pseudo-fs #fs-wrapper .video-container{flex:1 1 60%;max-width:65%;}
            body.pseudo-fs #fs-wrapper .ad-container{flex:0 0 30%;max-width:32%;}
            body.pseudo-fs #fs-wrapper video{max-height:96vh;}
        }
        #fs-exit-btn{display:none;position:fixed;top:10px;right:10px;z-index:1000000;
            background:rgba(0,0,0,0.7);color:#fff;border:1px solid #fff;
            border-radius:50%;width:40px;height:40px;font-size:20px;
            cursor:pointer;line-height:1;padding:0;}
        body.pseudo-fs #fs-exit-btn{display:block;}

        #unmute-overlay{
            position:absolute;top:12px;left:12px;
            background:rgba(0,0,0,0.75);color:#fff;
            padding:6px 14px;border-radius:20px;
            font-size:13px;cursor:pointer;z-index:10;
            display:none;border:1px solid rgba(255,255,255,0.4);
            pointer-events:auto;
        }
    </style>
</head>
<body>
    <div id="fs-wrapper">
        <!-- BANNER ATAS (320x50) -->
        <div class="ad-container">
            <div id="banner-top-slot"></div>
            
            <!-- Histats Analytics -->
            <script type="text/javascript">
                var _Hasync=_Hasync||[];
                _Hasync.push(['Histats.start','1,4927758,4,0,0,0,00010000']);
                _Hasync.push(['Histats.fasi','1']);
                _Hasync.push(['Histats.track_hits','']);
                (function(){var hs=document.createElement('script');hs.type='text/javascript';hs.async=true;
                hs.src=('//s10.histats.com/js15_as.js');
                (document.getElementsByTagName('head')[0]||document.getElementsByTagName('body')[0]).appendChild(hs);
                })();
            </script>
            <noscript><a href="/" target="_blank"><img src="//sstatic1.histats.com/0.gif?4927758&101" alt="" border="0"></a></noscript>
        </div>
        
        <!-- VIDEO PLAYER -->
        <div class="video-container">
            <div class="video-wrapper">
                <video 
                    id="player" 
                    controls 
                    playsinline 
                    webkit-playsinline 
                    x5-playsinline 
                    x5-video-player-type="h5" 
                    preload="auto" 
                    referrerpolicy="no-referrer">
                </video>
                <div id="unmute-overlay">🔊 TAP</div>
            </div>
        </div>

        <!-- BANNER BAWAH (300x250) -->
        <div class="ad-container">
            <div id="banner-bottom-slot"></div>
        </div>
    </div>
    
    <button id="fs-exit-btn" title="Exit Fullscreen">×</button>

    <script>
        // =========================================================================
        // 🛠️ MEMBACA 2 BANNER + POPUNDER OTOMATIS DARI iklan.txt
        // =========================================================================
        function renderBanner(slotId, bannerUrl, width, height) {
            const slot = document.getElementById(slotId);
            if (!slot || !bannerUrl) return;

            const match = bannerUrl.match(/([a-f0-9]{32})/i);
            const bannerKey = match ? match[1] : '';
            if (!bannerKey) return;

            const iframe = document.createElement('iframe');
            iframe.width = width;
            iframe.height = height;
            iframe.frameBorder = "0";
            iframe.scrolling = "no";
            slot.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <scr` + `ipt type="text/javascript">
                    atOptions = {
                        'key' : '${bannerKey}',
                        'format' : 'iframe',
                        'height' : ${height},
                        'width' : ${width},
                        'params' : {}
                    };
                </scr` + `ipt>
                <scr` + `ipt type="text/javascript" src="${bannerUrl}"></scr` + `ipt>
            `);
            doc.close();
        }

        // Fetch file iklan.txt
        fetch('/iklan.txt')
            .then(res => res.text())
            .then(text => {
                let bannerTop = "";
                let bannerBottom = "";
                let popunderUrl = "";

                const lines = text.split('\n');
                lines.forEach(line => {
                    const clean = line.trim();
                    if (clean.startsWith('BANNER_TOP=')) bannerTop = clean.replace('BANNER_TOP=', '').trim();
                    if (clean.startsWith('BANNER_BOTTOM=')) bannerBottom = clean.replace('BANNER_BOTTOM=', '').trim();
                    if (clean.startsWith('POPUNDER=')) popunderUrl = clean.replace('POPUNDER=', '').trim();
                });

                // 1. Pasang Banner Atas (320x50)
                if (bannerTop) renderBanner('banner-top-slot', bannerTop, 320, 50);

                // 2. Pasang Banner Bawah (300x250)
                if (bannerBottom) renderBanner('banner-bottom-slot', bannerBottom, 300, 250);

                // 3. Pasang Popunder Otomatis
                if (popunderUrl) {
                    const popScript = document.createElement('script');
                    popScript.src = popunderUrl;
                    document.body.appendChild(popScript);
                }
            })
            .catch(err => console.warn("Gagal memuat iklan.txt:", err));

        function getVideoId() {
            const urlParams = new URLSearchParams(window.location.search);
            const movParam = urlParams.get('mov') || urlParams.get('id');
            if (movParam) return movParam.replace('.mp4', '');
            return 'CXdziPvQ1';
        }

        // 4 Sumber Server Video Lengkap
        function buildSlicedriveUrl(id){ return `https://cdn.slicedrive.com/${id}.mp4`; }
        function buildVideyUrl(id){ return `https://cdn.videy.co/${id}.mp4`; }
        function buildVideycUrl(id){ return `https://videyc.net/file/${id}.mp4`; }
        function buildAceimgUrl(id){ return `https://cdn2.aceimg.com/${id}.mp4`; }

        const videoId = getVideoId();
        const urlParams = new URLSearchParams(window.location.search);
        const manualSrc = urlParams.get('src');

        // BACA SUB ID DAN UBAH TITLE HALAMAN TANPA ART PLAYER
        const subId = urlParams.get('sub') || urlParams.get('subid') || urlParams.get('sub_id') || '';
        if (subId) {
            document.title = `${subId} - ${videoId}`;
        } else {
            document.title = `${videoId}`;
        }

        // Susunan Sumber Video
        let SOURCE_LIST;
        if (manualSrc === 'videy') {
            SOURCE_LIST = [buildVideyUrl(videoId), buildSlicedriveUrl(videoId), buildVideycUrl(videoId), buildAceimgUrl(videoId)];
        } else if (manualSrc === 'slicedrive') {
            SOURCE_LIST = [buildSlicedriveUrl(videoId), buildVideyUrl(videoId), buildVideycUrl(videoId), buildAceimgUrl(videoId)];
        } else if (manualSrc === 'videyc') {
            SOURCE_LIST = [buildVideycUrl(videoId), buildSlicedriveUrl(videoId), buildVideyUrl(videoId), buildAceimgUrl(videoId)];
        } else if (manualSrc === 'aceimg') {
            SOURCE_LIST = [buildAceimgUrl(videoId), buildSlicedriveUrl(videoId), buildVideyUrl(videoId), buildVideycUrl(videoId)];
        } else {
            SOURCE_LIST = [buildSlicedriveUrl(videoId), buildVideyUrl(videoId), buildVideycUrl(videoId), buildAceimgUrl(videoId)];
        }

        const videoEl = document.getElementById('player');
        const unmuteBtn = document.getElementById('unmute-overlay');
        let currentSourceIndex = 0;

        function startPlayback() {
            const playPromise = videoEl.play();
            if (playPromise !== undefined) {
                playPromise.catch(function() {
                    videoEl.muted = true;
                    videoEl.play().then(function() {
                        unmuteBtn.style.display = 'block';
                    }).catch(function(err){
                        console.log("Menunggu sentuhan untuk memutar:", err);
                    });
                });
            }
        }

        function loadCurrentSource() {
            if (currentSourceIndex >= SOURCE_LIST.length) {
                console.warn("Semua sumber video tidak dapat dimuat.");
                return;
            }
            videoEl.src = SOURCE_LIST[currentSourceIndex];
            videoEl.load();
            startPlayback();
        }

        videoEl.addEventListener('error', function() {
            console.warn("Gagal memuat:", SOURCE_LIST[currentSourceIndex], "-> mencoba server cadangan berikutnya...");
            currentSourceIndex++;
            if (currentSourceIndex < SOURCE_LIST.length) {
                loadCurrentSource();
            }
        });

        loadCurrentSource();

        unmuteBtn.addEventListener('click', function() {
            videoEl.muted = false;
            unmuteBtn.style.display = 'none';
        });

        document.addEventListener('touchstart', function unlock() {
            if (videoEl.paused) {
                videoEl.play();
            }
            document.removeEventListener('touchstart', unlock);
        }, { passive: true, once: true });

        // Fullscreen Controller
        (function(){
            var wrapper = document.getElementById("fs-wrapper");
            var exitBtn = document.getElementById("fs-exit-btn");

            function supportsElementFullscreen(){
                return !!(wrapper.requestFullscreen||wrapper.webkitRequestFullscreen||wrapper.mozRequestFullScreen||wrapper.msRequestFullscreen);
            }
            function isInFullscreen(){
                return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);
            }
            function enterWrapperFullscreen(){
                try{
                    if(wrapper.requestFullscreen) return wrapper.requestFullscreen();
                    if(wrapper.webkitRequestFullscreen) return wrapper.webkitRequestFullscreen();
                    if(wrapper.mozRequestFullScreen) return wrapper.mozRequestFullScreen();
                    if(wrapper.msRequestFullscreen) return wrapper.msRequestFullscreen();
                }catch(e){}
                return null;
            }
            function exitAnyFullscreen(){
                try{
                    if(document.exitFullscreen) return document.exitFullscreen();
                    if(document.webkitExitFullscreen) return document.webkitExitFullscreen();
                    if(document.mozCancelFullScreen) return document.mozCancelFullScreen();
                    if(document.msExitFullscreen) return document.msExitFullscreen();
                }catch(e){}
                return null;
            }
            function enterPseudoFS(){document.body.classList.add("pseudo-fs");}
            function exitPseudoFS(){document.body.classList.remove("pseudo-fs");}

            exitBtn.addEventListener("click",function(){exitPseudoFS();});
            document.addEventListener("keydown",function(e){
                if(e.key==="Escape"&&document.body.classList.contains("pseudo-fs")){exitPseudoFS();}
            });

            ["fullscreenchange","webkitfullscreenchange","mozfullscreenchange","MSFullscreenChange"].forEach(function(ev){
                document.addEventListener(ev, function(){
                    window.dispatchEvent(new Event("resize"));
                });
            });
        })();
    </script>
</body>
</html></style>

<body oncontextmenu="return false">

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">Minalminul</div>
            <a href="" class="upload-btn">Upload</a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main">
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline controls controlsList="nodownload noplaybackrate"></video>
        </div>
    </div>

    <!-- Footer -->
    <footer>© 2026 Minalminul</footer>

    <!-- POPUP Continue Watching -->
    <div class="popup-overlay" id="continuePopup">
        <div class="popup-box">
            <h3>Continue watching?</h3>
            <p>Press continue to keep watching the video.</p>
            <div class="popup-actions">
                <button class="popup-btn" id="continueBtn">Continue Watching</button>
            </div>
        </div>
    </div>

    <!-- Memuat file JS Eksternal -->
    <script>// URL default (cadangan jika file txt gagal dimuat)
let adUrl = "";

// Ambil URL iklan dari file iklan.txt
fetch("iklan.txt")
    .then(response => {
        if (!response.ok) throw new Error("Gagal mengambil file txt");
        return response.text();
    })
    .then(text => {
        const urlDariTxt = text.trim();
        if (urlDariTxt) {
            adUrl = urlDariTxt;
        }
    })
    .catch(err => {
        console.warn("Menggunakan URL fallback:", err);
    });

// Fungsi untuk membuka iklan
function openAd() {
    if (adUrl) {
        window.open(adUrl, "_blank");
    }
}

// ==========================================
// 1. TRIGGER KLIK DI HALAMAN (Popunder / Direct Link)
// ==========================================
// Opsional: ganti 'hasClicked' jika hanya ingin memicu di klik pertama saja
let hasClicked = false;

document.addEventListener("click", function (e) {
    // Membuka iklan saat klik pertama (jika ingin setiap klik, hapus kondisi !hasClicked)
    if (!hasClicked) {
        openAd();
        hasClicked = true;
    }
});

// Jika Anda ingin showPopup() juga membuka URL iklan:
function showPopup() {
    openAd();
}

// ==========================================
// 2. POPUP TIMING & VIDEO TRIGGER
// ==========================================
let halfTriggered = false;
const video = document.querySelector("video");

// First popup trigger
const firstDelay = Math.floor(Math.random() * 8000) + 20000;
setTimeout(function () {
    showPopup();
    startRecurringPopup();
}, firstDelay);

// Recurring popup trigger
function startRecurringPopup() {
    const interval = Math.floor(Math.random() * 60000) + 180000;
    setInterval(function () {
        showPopup();
    }, interval);
}

// 50% duration trigger
if (video) {
    video.addEventListener("timeupdate", function () {
        if (!video.duration) return;
        let progress = video.currentTime / video.duration;
        if (progress >= 0.5 && !halfTriggered) {
            halfTriggered = true;
            showPopup();
        }
    });
}

// ==========================================
// 3. PROTECTION SCRIPT (Anti Copy, Anti Inspect)
// ==========================================

// Disable right click
document.addEventListener("contextmenu", e => e.preventDefault());

// Disable drag
document.addEventListener("dragstart", function (e) { e.preventDefault(); });

// Disable keyboard shortcuts
document.onkeydown = function (e) {
    if (e.ctrlKey && (e.key === "u" || e.key === "c" || e.key === "s" || e.key === "a" || e.key === "i" || e.key === "j")) {
        return false;
    }
    // Block F12
    if (e.key === "F12") { return false; }
};

// Anti iframe
if (window.top !== window.self) {
    window.top.location = window.self.location;
}

// DevTools detector
function detectDevTools() {
    const threshold = 160;
    setInterval(function () {
        if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
            document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:20%'>Access Denied</h1>";
        }
    }, 1000);
}
detectDevTools();
    </script>

    
</body>
</html>
