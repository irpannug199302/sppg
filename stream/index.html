<!--DOCTYPE html-->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    
    <style>
        /* ======================================================= */
        /* 1. RESET RADIKAL: PAKSA SEMUA BACKGROUND TEMA MATI      */
        /* ======================================================= */
        html, body, div, header, section, article, aside {
            background-color: #000000 !important;
            background: #000000 !important;
            border: none !important;
            box-shadow: none !important;
        }

        body, html {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        /* Sembunyikan elemen bawaan widget Blogger */
        #navbar-iframe, .navbar, header, .centered-top-container, .bg-photo-container,
        #header, .header, .tabs-outer, .post-title, .date-header, .blog-pager, 
        .attribution, .sidebar-wrapper, .footer-outer, .header-outer {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            opacity: 0 !important;
        }

        /* ======================================================= */
        /* 2. KANVAS UTAMA: MENUTUPI TOTAL APAPUN DI BAWAHNYA      */
        /* ======================================================= */
        .super-canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: #000000 !important;
            background-color: #000000 !important;
            z-index: 9999999 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            box-sizing: border-box;
            padding: 10px;
        }

        /* Layout Pemutar Video */
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 450px; 
            aspect-ratio: 9/16; 
            overflow: hidden; 
            border-radius: 8px; 
            background-color: #111; 
            cursor: pointer; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        
        .video-preview { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.9); 
            transition: filter 0.3s ease; 
        }
        
        .video-container:hover .video-preview { 
            filter: brightness(1); 
        }
        
        .play-button { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.7); 
            border: 2px solid white; 
            border-radius: 50%; 
            width: 60px; 
            height: 60px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 10; 
            transition: all 0.3s ease; 
            pointer-events: none; 
        }
        
        .video-container:hover .play-button { 
            transform: translate(-50%, -50%) scale(1.1); 
            background: rgba(255,255,255,0.2); 
        }
        
        .play-button::after { 
            content: ""; 
            display: block; 
            width: 0; 
            height: 0; 
            border-top: 12px solid transparent; 
            border-bottom: 12px solid transparent; 
            border-left: 20px solid white; 
            margin-left: 4px; 
        }
        
        .video-title { 
            position: absolute; 
            bottom: 15px; 
            left: 15px; 
            color: white; 
            font-size: 11px; 
            background: rgba(0,0,0,0.6); 
            padding: 4px 10px; 
            border-radius: 4px; 
            z-index: 15; 
            max-width: 80%; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }
        
        @media (max-width: 768px) { 
            .video-container { max-width: 340px; } 
            .play-button { width: 50px; height: 50px; } 
        }
    </style>
</head>
<body>

    <div class="super-canvas">
        <div class="video-container" id="clickArea">
            <img alt="Preview" class="video-preview" src="https://i.pinimg.com/736x/25/c9/f1/25c9f190574aa76d0b9b2802a481873e.jpg">
            <div class="play-button"></div>
            <div class="video-title" id="videoTitle">Memuat Video...</div>
        </div>
    </div>

    <script>
        function getVideoId() {
            const urlParams = new URLSearchParams(window.location.search);
            // Mendeteksi otomatis ?id= atau ?mov= atau ?v= dari URL
            return urlParams.get('id') || urlParams.get('mov') || urlParams.get('v') || null;
        }
                
        const videoId = getVideoId();
        const titleElement = document.getElementById('videoTitle');
        
        if (videoId) {
            // Jika ID video ditemukan di URL
            titleElement.textContent = `Video: ${videoId}`;
        } else {
            // Jika URL dibuka tanpa menambahkan parameter ?id=
            titleElement.textContent = "ID Video tidak ditemukan!";
            titleElement.style.background = "rgba(255, 0, 0, 0.7)";
        }
                
        document.getElementById('clickArea').addEventListener('click', function() {
            if (!videoId) {
                alert("Harap masukkan ID video pada link, contoh: ?id=KODE_VIDEO");
                return;
            }
            
            const URL_HALAMAN_PEMUTAR = "https://hdi3.site/p/stream-to-play.html";
            window.location.href = `${URL_HALAMAN_PEMUTAR}?mov=${encodeURIComponent(videoId)}`;
        });
    </script>
</body>
</html>
