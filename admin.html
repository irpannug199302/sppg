<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Control - CineStar Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-admin: #070b14;
            --card-admin: #0f172a;
            --cinema-red: #e50914;
            --accent-glow: #f87171;
            --text-light: #f1f5f9;
        }
        body { 
            background-color: var(--bg-admin); 
            color: var(--text-light); 
            font-family: 'Urbanist', sans-serif;
            padding-bottom: 60px;
        }
        .navbar-admin {
            background: linear-gradient(135deg, #0b0f19, #1c0a0c);
            border-bottom: 1px solid rgba(229, 9, 20, 0.2);
        }
        .card-custom {
            background-color: var(--card-admin);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .img-preview {
            height: 140px;
            width: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        .form-control-dark {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .table thead th {
            background: rgba(229, 9, 20, 0.15);
            color: var(--accent-glow);
            border: none;
            font-size: 13px;
        }
        .table tbody td {
            border-color: rgba(255,255,255,0.05);
            color: var(--text-light);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-admin py-3">
    <div class="container">
        <a class="navbar-brand fw-extrabold d-flex align-items-center gap-2" href="#">
            <i class="fa-solid fa-clapperboard text-danger"></i> CINESTAR EXECUTIVE DASHBOARD
        </a>
        <button class="btn btn-outline-light btn-sm fw-bold px-3 rounded-pill" id="btnLogout">
            <i class="fa-solid fa-right-from-bracket me-1"></i> Keluar
        </button>
    </div>
</nav>

<div class="container mt-4">
    <div class="mb-4">
        <h2 class="fw-extrabold m-0">CINEMA <span class="text-danger">OPERATIONAL CONTROL</span></h2>
        <p class="text-white-50">Monitoring Penayangan Film, Laporan Operator Proyektor, & Data Tiket</p>
    </div>

    <!-- UPDATE POSTER REKOMENDASI -->
    <div class="card-custom">
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-image text-danger me-2"></i> Update Poster Film Pilihan Hari Ini</h4>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label small text-white-50">Poster 1 (Slot Kiri)</label>
                <div class="input-group mb-2">
                    <input type="text" id="url-poster1" class="form-control form-control-sm form-control-dark" placeholder="URL Poster...">
                    <button class="btn btn-danger btn-sm" onclick="simpanPoster('poster1')">Set</button>
                </div>
                <img id="prev-poster1" src="https://picsum.photos/400/600?1" class="img-preview">
            </div>
            <div class="col-md-4">
                <label class="form-label small text-white-50">Poster 2 (Slot Tengah)</label>
                <div class="input-group mb-2">
                    <input type="text" id="url-poster2" class="form-control form-control-sm form-control-dark" placeholder="URL Poster...">
                    <button class="btn btn-danger btn-sm" onclick="simpanPoster('poster2')">Set</button>
                </div>
                <img id="prev-poster2" src="https://picsum.photos/400/600?2" class="img-preview">
            </div>
            <div class="col-md-4">
                <label class="form-label small text-white-50">Poster 3 (Slot Kanan)</label>
                <div class="input-group mb-2">
                    <input type="text" id="url-poster3" class="form-control form-control-sm form-control-dark" placeholder="URL Poster...">
                    <button class="btn btn-danger btn-sm" onclick="simpanPoster('poster3')">Set</button>
                </div>
                <img id="prev-poster3" src="https://picsum.photos/400/600?3" class="img-preview">
            </div>
        </div>
    </div>

    <!-- TABEL STATUS OPERATOR PROYEKTOR PER STUDIO -->
    <div class="card-custom">
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-video text-danger me-2"></i> Status Penayangan Seluruh Studio</h4>
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
                <thead>
                    <tr>
                        <th>Studio</th>
                        <th>Film</th>
                        <th>Operator Bertugas</th>
                        <th>Jam Mulai</th>
                        <th>Status Putar</th>
                        <th>Suhu Proyektor</th>
                        <th>Bukti Layar</th>
                    </tr>
                </thead>
                <tbody id="tabelAdminStudio"></tbody>
            </table>
        </div>

        <!-- ACTION BUTTONS: DOWNLOAD EXCEL & RESET HARIAN -->
        <div class="row g-3 mt-4">
            <div class="col-md-6">
                <button class="btn btn-success w-100 py-3 fw-bold rounded-3" id="btnDownloadExcel">
                    <i class="fa-solid fa-file-excel me-2"></i> UNDUH LAPORAN PENAYANGAN HARI INI (.XLSX)
                </button>
            </div>
            <div class="col-md-6">
                <button class="btn btn-danger w-100 py-3 fw-bold rounded-3" id="btnResetHarian">
                    <i class="fa-solid fa-rotate me-2"></i> RESET JADWAL & STATUS PENAYANGAN HARIAN
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDeOduyu626TZ9CR0JGvzBH0qJAoArT8rk",
        authDomain: "sppgbangunsari02-b5cb1.firebaseapp.com",
        projectId: "sppgbangunsari02-b5cb1",
        storageBucket: "sppgbangunsari02-b5cb1.firebasestorage.app",
        messagingSenderId: "497486447370",
        appId: "1:497486447370:web:0b2b6ce4297b48d18b70f3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. Cek Login
    firebase.auth().onAuthStateChanged((user) => {
        if(!user) {
            window.location.href = "login.html";
        } else {
            initAdmin();
        }
    });

    let simpanPoster;

    function initAdmin() {
        // Ambil data poster
        db.collection("cinema_posters").doc("highlight").onSnapshot((doc) => {
            if(doc.exists) {
                const d = doc.data();
                if(d.poster1) { document.getElementById("prev-poster1").src = d.poster1; document.getElementById("url-poster1").value = d.poster1; }
                if(d.poster2) { document.getElementById("prev-poster2").src = d.poster2; document.getElementById("url-poster2").value = d.poster2; }
                if(d.poster3) { document.getElementById("prev-poster3").src = d.poster3; document.getElementById("url-poster3").value = d.poster3; }
            }
        });

        // Set Poster
        simpanPoster = async function(slot) {
            const url = document.getElementById(`url-${slot}`).value.trim();
            if(!url) return alert("Masukkan link URL gambar!");
            try {
                await db.collection("cinema_posters").doc("highlight").set({ [slot]: url }, { merge: true });
                alert("Poster berhasil diperbarui!");
            } catch(e) {
                alert("Gagal: " + e.message);
            }
        };

        // Render Studio
        db.collection("studios").onSnapshot((snapshot) => {
            const tb = document.getElementById("tabelAdminStudio");
            tb.innerHTML = "";
            snapshot.forEach((doc) => {
                const s = doc.data();
                tb.innerHTML += `
                    <tr>
                        <td class="fw-bold text-white">${s.nama_studio || '-'}</td>
                        <td class="text-warning">${s.judul_film || '-'}</td>
                        <td>${s.operator || '-'}</td>
                        <td>${s.jam_mulai || '-'} WIB</td>
                        <td><span class="badge ${s.status_tayang === 'Sedang Memutar' ? 'bg-success' : 'bg-warning text-dark'}">${s.status_tayang || 'Standby'}</span></td>
                        <td>${s.suhu_proyektor || '-'}</td>
                        <td>${s.foto_bukti ? `<a href="${s.foto_bukti}" target="_blank" class="text-danger fw-bold text-decoration-none">Lihat Foto</a>` : '-'}</td>
                    </tr>
                `;
            });
        });

        // Download Excel
        document.getElementById("btnDownloadExcel").addEventListener("click", async () => {
            const snap = await db.collection("studios").get();
            const dataExport = [];
            snap.forEach(doc => {
                const d = doc.data();
                dataExport.push({
                    "Studio": d.nama_studio || "-",
                    "Judul Film": d.judul_film || "-",
                    "Operator": d.operator || "-",
                    "Jam Putar": d.jam_mulai || "-",
                    "Status Tayang": d.status_tayang || "-",
                    "Suhu Proyektor": d.suhu_proyektor || "-",
                    "Link Bukti Foto": d.foto_bukti || "-"
                });
            });

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataExport), "Laporan Studio");
            XLSX.writeFile(wb, `Laporan_CineStar_${new Date().toISOString().split('T')[0]}.xlsx`);
        });

        // Reset Harian
        document.getElementById("btnResetHarian").addEventListener("click", async () => {
            if(confirm("Apakah Anda yakin ingin mereset seluruh jadwal dan status studio hari ini?")) {
                const snap = await db.collection("studios").get();
                const batch = db.batch();
                snap.forEach(doc => {
                    batch.update(db.collection("studios").doc(doc.id), {
                        status_tayang: "Standby",
                        operator: "-",
                        jam_mulai: "",
                        suhu_proyektor: "-",
                        foto_bukti: ""
                    });
                });
                await batch.commit();
                alert("Seluruh jadwal tayang telah di-reset ke status awal.");
            }
        });
    }

    document.getElementById("btnLogout").addEventListener("click", () => {
        firebase.auth().signOut().then(() => window.location.href = "login.html");
    });
</script>
</body>
</html>
