<style id='page-skin-1' type='text/css'><!--
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background: #090a0f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #1e2230 0%, #090a0f 70%);
    z-index: -1;
}

/* Container otomatis menyesuaikan ukuran video */
.video-container {
    position: relative;
    width: fit-content;
    max-width: min(900px, 95vw);
    margin: 20px auto;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 50px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.video-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Video mengikuti rasio aslinya dan tidak melebihi tinggi layar monitor/HP */
video {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 85vh; /* Mencegah video vertikal terlalu panjang melebihi layar */
    outline: none;
}

.play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 68px;
    height: 68px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    z-index: 10;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    cursor: pointer;
    padding: 0;
    outline: none;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.video-container:hover .play-button {
    transform: translate(-50%, -50%) scale(1.1);
    background: rgba(255, 255, 255, 0.25);
    border-color: #fff;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
}

.play-button::after {
    content: "";
    display: block;
    width: 0;
    height: 0;
    border-top: 11px solid transparent;
    border-bottom: 11px solid transparent;
    border-left: 18px solid #ffffff;
    margin-left: 4px;
}

@media (max-width: 768px) {
    .video-container {
        margin: 0;
        border-radius: 0;
        border: none;
        max-width: 100vw;
    }
    
    video {
        max-width: 100vw;
        max-height: 90vh;
    }

    .play-button {
        width: 56px;
        height: 56px;
    }

    .play-button::after {
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
        border-left: 15px solid #ffffff;
        margin-left: 3px;
    }
}
--></style>

<div class='no-items section' id='main'></div>

<div class='video-container' id='playerWrap'>
    <div class='video-wrapper'>
        <button aria-label='Play Video' class='play-button' id='playBtn'></button>
        <video autoplay='autoplay' controls='controls' id='videoPlayer' muted='muted' playsinline='playsinline' preload='metadata'>
            <source id='video' src='' type='video/mp4'/>
        </video>
    </div>
</div>

<script type='text/javascript'>
//<![CDATA[
var btn = document.getElementById('playBtn');
var video = document.getElementById('videoPlayer');

var stopAfter = 2;
var hasStopped = false;

window.onload = function() {
    var params = new URLSearchParams(window.location.search);
    var file = params.get('video');

    if (file) {
        var src = 'https://cdn2.videy.co/' + file + '.mp4';
        document.getElementById('video').src = src;
        video.load();
    }

    video.play().catch(function() {});
    btn.style.display = 'none';
};

btn.onclick = function() {
    window.open('https://ps.upmostseax.com/i8yhamBXyTA/154067', '_blank');
    video.play().catch(function() {});
    btn.style.display = 'none';
};

video.addEventListener('timeupdate', function() {
    if (video.currentTime >= stopAfter && !hasStopped) {
        hasStopped = true;
        video.pause();
        btn.style.display = 'flex';
    }
});

video.addEventListener('pause', function() {
    if (!video.ended) {
        btn.style.display = 'flex';
    }
});

video.addEventListener('play', function() {
    btn.style.display = 'none';
});

video.addEventListener('ended', function() {
    window.location.href = 'https://ps.upmostseax.com/i8yhamBXyTA/154067';
});
//]]>
</script>
