<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Memuat Video...</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-card: #1f1f1f;
      --bg-hover: #272727;
      --primary-color: #ff0000;
      --text-main: #f1f1f1;
      --text-muted: #aaaaaa;
      --border-color: #272727;
      --accent-blue: #3ea6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    
    .navbar {
      height: 56px; background-color: var(--bg-main); display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; }
    .logo i { color: var(--primary-color); font-size: 24px; }

    .watch-container { max-width: 960px; width: 100%; margin: 24px auto; padding: 0 16px; flex: 1; }
    .player-wrapper { width: 100%; background: #000; display: flex; justify-content: center; align-items: center; max-height: 65vh; overflow: hidden; border-radius: 12px; }
    video { width: 100%; height: auto; max-height: 65vh; object-fit: contain; display: block; }

    .video-info { background-color: var(--bg-card); padding: 20px; border-radius: 12px; margin-top: 16px; }
    .video-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; line-height: 1.35; color: #fff; }
    .video-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .video-stats { display: flex; align-items: center; gap: 10px; }
    
    .badge { background: var(--bg-hover); color: var(--accent-blue); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    .views-badge { color: var(--text-main); background: #2b2b2b; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    
    .action-btn { background: #2b2b2b; color: var(--text-main); border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s; }
    .action-btn:hover { background: var(--bg-hover); }
    .action-btn.liked { background: rgba(62, 166, 255, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

    .video-desc { background: var(--bg-hover); padding: 14px 16px; border-radius: 8px; font-size: 14px; color: #d9d9d9; line-height: 1.5; white-space: pre-line; margin-top: 12px; }
    
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-blue); text-decoration: none; margin-bottom: 16px; font-size: 14px; font-weight: 500; }
    .back-btn:hover { text-decoration: underline; }

    .footer { background-color: #050505; border-top: 1px solid var(--border-color); padding: 24px; text-align: center; font-size: 13px; color: var(--text-muted); margin-top: auto; }
  </style>

  <!-- Histats.com START (async) -->
  <script type="text/javascript">
    var urlParams = new URLSearchParams(window.location.search);
    var videoId = urlParams.get('v') || 'unknown';
    
    var _Hasync = _Hasync || [];
    _Hasync.push(['Histats.start', '1,4927758,4,0,0,0,00010000']);
    _Hasync.push(['Histats.fasi', '1']);
    _Hasync.push(['Histats.track_hits', '']);
    
    (function() {
      var hs = document.createElement('script'); hs.type = 'text/javascript'; hs.async = true;
      hs.src = ('//s10.histats.com/js15_as.js');
      (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(hs);
    })();
  </script>
  <!-- Histats.com END -->
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo"><i class="fa-solid fa-circle-play"></i> StreamTube</a>
  </header>

  <div class="watch-container">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
    
    <div class="player-wrapper" id="playerWrapper">
      <video id="mainPlayer" controls autoplay playsinline preload="auto">
        Browser Anda tidak mendukung pemutar video.
      </video>
    </div>

    <div class="video-info">
      <h1 class="video-title" id="videoTitle">Memuat Judul...</h1>
      
      <div class="video-bar">
        <div class="video-stats">
          <span class="badge" id="videoCategory"><i class="fa-solid fa-tag"></i> Category</span>
          <span class="views-badge" id="videoViews"><i class="fa-solid fa-eye"></i> 0 Views</span>
        </div>

        <div class="video-actions">
          <button class="action-btn" id="likeBtn" onclick="toggleLike()">
            <i class="fa-regular fa-thumbs-up" id="likeIcon"></i> 
            <span id="likeText">Suka</span> 
            <span id="likeCount">(0)</span>
          </button>
        </div>
      </div>

      <div class="video-desc" id="videoDesc">Memuat deskripsi...</div>
    </div>
  </div>

  <footer class="footer">
    &copy; 2026 <strong>StreamTube</strong>. All Rights Reserved.
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbya8miU2RQxomRMAr-3S5r7d6sHw-7kNlgJup0n5l_KUQWc_XYVfLzYbKRDEO9av5jnDQ/exec";
    let currentVideo = null;

    function loadWatchVideo() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('v');

      if (!targetId) {
        window.location.href = 'index.html';
        return;
      }

      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleWatchData&t=" + new Date().getTime();
      document.body.appendChild(script);
    }

    function handleWatchData(videos) {
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('v');

      const found = (videos || []).find(v => String(v.ID || v.id) === String(targetId));

      if (!found) {
        document.getElementById('videoTitle').innerText = "Video tidak ditemukan.";
        return;
      }

      currentVideo = {
        id: found.ID || found.id,
        Title: found.Title || 'Tanpa Judul',
        Category: found.Category || 'Umum',
        Description: found.Description || 'Tidak ada deskripsi tersedia.',
        CDN_URL: found.CDN_URL || found.Video_URL || '',
        Views: parseInt(found.Views || found.Views_Count || 0, 10),
        Likes: parseInt(found.Likes || 0, 10),
        isLiked: false
      };

      // 1. Ubah Judul Dokumen agar Histats merekam judul dari spreadsheet
      const sheetTitle = `[${currentVideo.id}] ${currentVideo.Title}`;
      document.title = sheetTitle;

      // 2. Kirim pemicu pelacakan manual ke Histats untuk halaman fisik ini
      try {
        if (window._Hasync) {
          window._Hasync.push(['Histats.title', sheetTitle]);
          window._Hasync.push(['Histats.track_hits', '']);
        }
        const pixel = new Image();
        pixel.src = "https://sstatic1.histats.com/0.gif?4927758&101&fasi=1&track_hits=1&title=" + encodeURIComponent(sheetTitle) + "&t=" + Date.now();
      } catch (err) {
        console.warn("Histats tracking error:", err);
      }

      // 3. Masukkan data ke elemen HTML
      document.getElementById('videoTitle').innerText = currentVideo.Title;
      document.getElementById('videoCategory').innerHTML = `<i class="fa-solid fa-tag"></i> ${currentVideo.Category}`;
      document.getElementById('videoViews').innerHTML = `<i class="fa-solid fa-eye"></i> ${currentVideo.Views.toLocaleString('id-ID')} x ditonton`;
      document.getElementById('videoDesc').innerText = currentVideo.Description;

      // 4. Putar video
      const player = document.getElementById('mainPlayer');
      player.src = currentVideo.CDN_URL;
      player.load();

      player.play().catch((err) => {
        console.log("Autoplay diblokir browser, silakan klik tombol play manual:", err);
      });

      updateLikeUI();
      pingIncrementView(currentVideo.id);
    }

    function toggleLike() {
      if (!currentVideo) return;
      currentVideo.isLiked = !currentVideo.isLiked;

      if (currentVideo.isLiked) {
        currentVideo.Likes += 1;
      } else {
        currentVideo.Likes = Math.max(0, currentVideo.Likes - 1);
      }

      updateLikeUI();

      try {
        const pingImg = new Image();
        pingImg.src = `${API_URL}?action=toggleLike&id=${encodeURIComponent(currentVideo.id)}&status=${currentVideo.isLiked}&likes=${currentVideo.Likes}&t=${Date.now()}`;
      } catch (e) {}
    }

    function updateLikeUI() {
      if (!currentVideo) return;
      const likeBtn = document.getElementById('likeBtn');
      const likeIcon = document.getElementById('likeIcon');
      const likeText = document.getElementById('likeText');
      const likeCount = document.getElementById('likeCount');

      likeCount.innerText = `(${currentVideo.Likes.toLocaleString('id-ID')})`;
      if (currentVideo.isLiked) {
        likeBtn.classList.add('liked');
        likeIcon.className = 'fa-solid fa-thumbs-up';
        likeText.innerText = 'Disukai';
      } else {
        likeBtn.classList.remove('liked');
        likeIcon.className = 'fa-regular fa-thumbs-up';
        likeText.innerText = 'Suka';
      }
    }

    function pingIncrementView(videoId) {
      try {
        const pingImg = new Image();
        pingImg.src = `${API_URL}?action=view&id=${encodeURIComponent(videoId)}&t=${Date.now()}`;
      } catch (e) {}
    }

    loadWatchVideo();
  </script>

</body>
</html>
