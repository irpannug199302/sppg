<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">StreamTube - Platform Video Modern</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-card: #1f1f1f;
      --bg-hover: #272727;
      --primary-color: #ff0000;
      --text-main: #f1f1f1;
      --text-muted: #aaaaaa;
      --border-color: #272727;
      --accent-blue: #3ea6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Navbar */
    .navbar {
      height: 56px;
      background-color: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }

    .logo i {
      color: var(--primary-color);
      font-size: 24px;
    }

    /* Search Box */
    .search-box {
      display: flex;
      align-items: center;
      background: #121212;
      border: 1px solid #303030;
      border-radius: 40px;
      padding: 6px 16px;
      width: 40%;
      max-width: 500px;
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent-blue);
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      width: 100%;
      outline: none;
      font-size: 14px;
    }

    .search-box button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-box button:hover {
      color: #fff;
    }

    /* Main Container */
    .container {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }

    .grid-header {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-title {
      font-size: 20px;
      font-weight: 700;
    }

    .video-count-info {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Video Cards Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .video-card {
      background-color: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    .video-card:hover {
      transform: translateY(-4px);
      background-color: var(--bg-hover);
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }

    .thumbnail-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    .thumbnail-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-details {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .dot-separator {
      font-size: 8px;
    }

    .loading-state {
      color: var(--text-muted);
      font-size: 15px;
      text-align: center;
      grid-column: 1 / -1;
      padding: 60px 0;
    }

    /* Footer */
    .footer {
      background-color: #050505;
      border-top: 1px solid var(--border-color);
      padding: 24px;
      margin-top: auto;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--text-main);
    }

    .copyright {
      margin-top: 8px;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .container { padding: 16px; }
      .search-box { width: 60%; }
      .video-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    }
  </style>

  <!-- Histats.com START (async) -->
  <script type="text/javascript">
    var _Hasync = _Hasync || [];
    _Hasync.push(['Histats.start', '1,4927758,4,0,0,0,00010000']);
    _Hasync.push(['Histats.fasi', '1']);
    (function() {
      var hs = document.createElement('script'); hs.type = 'text/javascript'; hs.async = true;
      hs.src = ('//s10.histats.com/js15_as.js');
      (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(hs);
    })();
  </script>
  <!-- Histats.com END -->
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <i class="fa-solid fa-circle-play"></i> StreamTube
    </a>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for videos..." onkeyup="filterVideos()">
      <button onclick="filterVideos()" title="Cari"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <div class="container">
    <div class="grid-header">
      <h2 class="grid-title" id="gridTitle">Video List</h2>
      <span class="video-count-info" id="videoCountInfo"></span>
    </div>

    <div class="video-grid" id="videoGrid">
      <div class="loading-state">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="margin-bottom: 12px; color: var(--primary-color);"></i>
        <br>Memuat daftar video...
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-links">
      <a href="#">About Us</a>
      <a href="#">Terms of Service</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Contact</a>
    </div>
    <div class="copyright">
      &copy; 2026 <strong>StreamTube</strong>. All Rights Reserved.
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbya8miU2RQxomRMAr-3S5r7d6sHw-7kNlgJup0n5l_KUQWc_XYVfLzYbKRDEO9av5jnDQ/exec";
    let allVideosData = [];

    function formatViews(views) {
      const num = parseInt(views, 10) || 0;
      if (num >= 1000000) {
        return (num / 1000000).toFixed(1).replace(/\.0$/, '') + ' jt Views';
      } else if (num >= 1000) {
        return (num / 1000).toFixed(1).replace(/\.0$/, '') + ' rb Views';
      }
      return num.toLocaleString('id-ID') + ' Views';
    }

    function loadVideos() {
      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleData&t=" + new Date().getTime();
      
      script.onerror = function() {
        document.getElementById('videoGrid').innerHTML = '<div class="loading-state">Gagal memuat data dari Spreadsheet.</div>';
      };
      
      document.body.appendChild(script);
    }

    function handleData(videos) {
      allVideosData = (videos || []).map((video, index) => {
        const rawViews = video.Views !== undefined ? video.Views : (video.Views_Count !== undefined ? video.Views_Count : 0);
        const rawLikes = video.Likes !== undefined ? video.Likes : 0;
        
        return {
          id: video.ID || video.id || `vid_${index + 1}`,
          Title: video.Title || 'Tanpa Judul',
          Category: video.Category || 'Umum',
          Description: video.Description || 'Tidak ada deskripsi tersedia.',
          CDN_URL: video.CDN_URL || video.Video_URL || '',
          Thumbnail_URL: video.Thumbnail_URL || 'https://via.placeholder.com/320x180/1a1a1a/ffffff?text=StreamTube',
          Views: parseInt(rawViews, 10) || 0,
          Likes: parseInt(rawLikes, 10) || 0
        };
      });

      renderVideoList(allVideosData);
    }

    function renderVideoList(videos) {
      const grid = document.getElementById('videoGrid');
      const countInfo = document.getElementById('videoCountInfo');
      grid.innerHTML = '';

      if (countInfo) {
        countInfo.innerText = `Menampilkan ${videos.length} video`;
      }

      if (!videos || videos.length === 0) {
        grid.innerHTML = '<div class="loading-state"><i class="fa-regular fa-folder-open fa-2x" style="margin-bottom:12px;"></i><br>Tidak ada video yang cocok.</div>';
        return;
      }

      videos.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="thumbnail-box">
            <img src="${video.Thumbnail_URL}" alt="${video.Title}" onerror="this.src='https://via.placeholder.com/320x180/1f1f1f/aaaaaa?text=StreamTube'">
          </div>
          <div class="card-details">
            <div class="card-title">${video.Title}</div>
            <div class="card-meta">
              <span>${video.Category}</span>
              <span class="dot-separator"><i class="fa-solid fa-circle"></i></span>
              <span><i class="fa-regular fa-eye"></i> ${formatViews(video.Views)}</span>
            </div>
          </div>
        `;
        // Mengarahkan ke halaman watch.html secara fisik saat kartu diklik
        card.onclick = () => {
          window.location.href = `watch.html?v=${encodeURIComponent(video.id)}`;
        };
        grid.appendChild(card);
      });
    }

    function filterVideos() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      const filtered = allVideosData.filter(video => {
        const titleMatch = (video.Title || '').toLowerCase().includes(query);
        const categoryMatch = (video.Category || '').toLowerCase().includes(query);
        const descMatch = (video.Description || '').toLowerCase().includes(query);
        return titleMatch || categoryMatch || descMatch;
      });

      renderVideoList(filtered);
    }

    loadVideos();
  </script>

</body>
</html>
